AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - CloudFront distribution that serves the backend (Lambda function URL)
  on its own HTTPS domain, e.g. api.example.com. Deployed by `make add-api-domain`.
  Nothing is cached: every request goes to the function.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  ApiDomainName:
    Type: String
    Description: Custom domain of the API, e.g. api.example.com
  CertificateArn:
    Type: String
    Description: ACM certificate for ApiDomainName (must be in us-east-1)
  FunctionUrlDomain:
    Type: String
    Description: Host name of the Lambda function URL, e.g. abc123.lambda-url.eu-central-1.on.aws
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route 53 hosted zone of ApiDomainName; if set, the alias records are created here

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} API"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: [!Ref ApiDomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: api
            DomainName: !Ref FunctionUrlDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df4-4b5a84be39ad # Managed-CachingDisabled
          # Forwards every header (Authorization, Origin, ...) except Host: the function URL
          # only answers to its own host name.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Z2FDTNDATAQYW2 is the fixed hosted zone of every CloudFront distribution.
  DomainRecordIPv4:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DomainRecordIPv6:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  ApiDomainUrl:
    Value: !Sub "https://${ApiDomainName}"
