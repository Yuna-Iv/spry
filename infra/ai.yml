AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - the agenda parser ("Paste an agenda"). A Lambda function with a public,
  authenticated function URL: the browser sends pasted text, the function asks Claude on Amazon
  Bedrock for a structured agenda, validates it and returns JSON. It runs outside the VPC (it
  never touches the database) and reaches Bedrock over the internet: no NAT, no VPC endpoint,
  $0 while nobody uses it. Saving goes through the main API, never through this function.
  Also a $5 monthly AWS Budgets alarm. Deployed by `make deploy-ai`.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  ImageUri:
    Type: String
    Description: The backend's container image (the deploy script reads it from the backend function).
  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Bedrock model id, or an inference profile id with BedrockApi=runtime.
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region that serves the model; may differ from the stack's region.
  BedrockApi:
    Type: String
    Default: mantle
    AllowedValues: [mantle, runtime]
    Description: mantle = bedrock-mantle (current Claude models), runtime = bedrock-runtime InvokeModel.
  ParserEffort:
    Type: String
    Default: low
    Description: Claude's effort setting (low ... max), or "none" for models without it.
  ParserFake:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true returns a fixed agenda without calling the model (for building the screen).
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  CognitoJwks:
    Type: String
    Default: ""
    Description: The pool's jwks.json (read from the backend function); empty = downloaded on first use.
  CorsOrigins:
    Type: CommaDelimitedList
    Description: Sites allowed to call the function URL (the frontend's addresses).
  BudgetEmail:
    Type: String
    Default: ""
    Description: AWS Budgets emails this address when the month's cost passes $5. Empty = no budget.

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/agenda-parser
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      # Logs only: no VPC access, no database, no S3. The function reads text and calls a model.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: call-bedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # "*" for now: any model, in any region. Narrowing it to the one model (and its
              # inference profile) is a discussion question of the lab.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel # BedrockApi=runtime
                  - bedrock-mantle:CreateInference # BedrockApi=mantle
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-agenda-parser
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      # The backend's image with another app: Lambda Web Adapter (in the image) passes each
      # function-URL request to uvicorn, as for the report builder.
      ImageConfig:
        Command: [uvicorn, app.ai.agenda_lambda:app, --host, 0.0.0.0, --port, "8000"]
      Architectures: [arm64]
      MemorySize: 512
      # A parse takes 2-8 s; one retry after an invalid answer can double that.
      Timeout: 30
      Role: !GetAtt FunctionRole.Arn
      # No VpcConfig: the parser needs no database and reaches Bedrock over the internet.
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_API: !Ref BedrockApi
          PARSER_EFFORT: !Ref ParserEffort
          PARSER_FAKE: !Ref ParserFake
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks
          AWS_LWA_PORT: "8000"
          AWS_LWA_READINESS_CHECK_PATH: /health
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Public, but every request needs a Cognito ID token (checked in the app) because every parse
  # costs money. CORS lives here, not in the app: both would duplicate the headers.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref CorsOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  # A public function URL needs both permissions. (Function URLs and permissions have no tags.)
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # The cheapest insurance in the course: an email when the account's cost for the month
  # passes $5 (actual), and when it is forecast to.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub ${ProjectName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ParserUrl:
    Description: Function URL without the trailing slash; the frontend is built against it
    Value: !Sub
      - https://${Domain}
      - Domain: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  FunctionName:
    Value: !Ref Function
  LogGroup:
    Value: !Ref LogGroup
